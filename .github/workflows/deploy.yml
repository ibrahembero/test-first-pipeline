name: Deploy Web Site to Local VM

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Nginx
      run: |
        echo "🚀 Starting Deployment..."
        cp -r ./* /var/www/html/
        echo "✅ Deployment Finished Successfully!"